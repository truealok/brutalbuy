<svg xmlns="http://www.w3.org/2000/svg" width="360" height="72" viewBox="0 0 360 72" role="img" aria-label="Brutal Buy">
  <defs>
    <linearGradient id="bbTan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2C29B"/>
      <stop offset="1" stop-color="#D9966B"/>
    </linearGradient>
  </defs>
  <!-- package mark -->
  <g transform="translate(6,8)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#bbTan)"/>
    <rect x="12" y="14" width="32" height="28" rx="5" fill="#122A1D"/>
    <rect x="26" y="14" width="4" height="28" fill="url(#bbTan)"/>
    <rect x="10" y="11" width="36" height="7" rx="3" fill="#1E3A2A"/>
  </g>
  <!-- wordmark -->
  <text x="74" y="50" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="1" fill="#F2E9DC">BRUTAL<tspan fill="#D98E5F"> BUY</tspan></text>
</svg>
