<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B2B & Wholesale — Brutal Buy</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header"></div>

  <section class="page-hero">
    <div class="container">
      <h1>Built for Teams & Business</h1>
      <p>Academies, clubs, schools and corporate programs — kit everyone out with wholesale pricing and custom branding.</p>
    </div>
  </section>

  <main class="container page-body">
    <div id="b2bSections" style="display:grid;gap:26px;max-width:860px;margin-inline:auto"></div>

    <div class="contact-card" style="max-width:860px;margin:34px auto 0">
      <h3 style="font-weight:900;margin-bottom:6px">Request a bulk quote</h3>
      <p style="color:var(--text-dim);font-size:14px;margin-bottom:18px">Tell us what you need — we reply within one business day.</p>
      <form class="form-grid" onsubmit="event.preventDefault();this.reset();BB.toast('Quote request sent! 📦')">
        <div class="form-row">
          <div class="field"><input placeholder="Organization name" required></div>
          <div class="field"><input type="email" placeholder="Work email" required></div>
        </div>
        <div class="form-row">
          <div class="field"><input placeholder="Sport / category"></div>
          <div class="field"><input type="number" placeholder="Estimated quantity" min="1"></div>
        </div>
        <div class="field"><textarea rows="4" placeholder="Anything else we should know?"></textarea></div>
        <button class="btn btn-primary" style="justify-self:start">Send request →</button>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    const icons = { "bulk-orders": "📦", "customization": "🎨", "wholesale": "🏷️", "bulk-enquiry": "📝" };
    document.getElementById("b2bSections").innerHTML = BB.b2b.map((b, i) => `
      <section class="contact-card reveal" id="${b.id}" data-delay="${(i % 4) + 1}">
        <div style="font-size:30px">${icons[b.id] || "⚡"}</div>
        <h3 style="font-weight:900;font-size:22px;margin:10px 0 6px">${b.name}</h3>
        <p style="color:var(--text-dim);font-size:14.5px;margin-bottom:14px">
          ${b.sub.join(" • ")} — handled by a dedicated Brutal Buy account manager from quote to delivery.
        </p>
        <a class="section-link" href="contact.html">Talk to the team →</a>
      </section>`).join("");
    BB.bindReveals();
  </script>
</body>
</html>
